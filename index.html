<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Dollar Search</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito+Sans:opsz,wght@6..12,400;6..12,600;6..12,700&display=swap">
<style id="site-style">
  /* Layout: a homepage (hero + profile cards) and one profile view at a time (hero, research cards, contact). */
  :root {
    --bg: #FFF9F0;
    --surface: #FFFCF7;
    --blush: #FBE3E6;
    --pink: #F6CDD8;
    --button: #F7C8D4;
    --button-fg: #8E3553;
    --accent: #D2728F;
    --fg: #BC5C7A;
    --muted: #B06A80;
    --line: #EFDAD0;
    --display: "Fredoka", "Nunito", ui-rounded, system-ui, sans-serif;
    --body: "Nunito Sans", "Segoe UI", system-ui, sans-serif;
  }

  body {
    background: var(--bg);
    color: var(--fg);
    font-family: var(--body);
    font-size: 1.0625rem;
    line-height: 1.6;
  }
  .wrap {
    max-width: 68rem;
    margin: 0 auto;
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
  }
  h1, h2, h3 { font-family: var(--display); line-height: 1.1; text-wrap: balance; margin: 0; }
  p { margin: 0; }
  a { color: var(--accent); }
  :focus-visible { outline: 3px solid var(--accent); outline-offset: 3px; border-radius: 8px; }

  /* Top bar */
  .top { padding-block: 1.25rem; }
  .top .wrap { display: flex; justify-content: space-between; align-items: center; gap: 1rem; flex-wrap: wrap; }
  .brand { font-family: var(--display); font-weight: 600; font-size: 1.15rem; text-decoration: none; color: var(--fg); }
  .brand span { color: var(--accent); }
  .nav { display: flex; gap: 1.25rem; }
  .nav a { color: var(--muted); text-decoration: none; font-weight: 600; font-size: 0.95rem; }
  .nav a:hover { color: var(--accent); }

  /* Notification bell: new research from followed profiles */
  .top-actions { position: relative; display: flex; align-items: center; gap: 1rem; margin-left: auto; }
  .bell-btn {
    position: relative; display: grid; place-items: center; flex: none;
    width: 2.5rem; height: 2.5rem; border-radius: 50%; border: 0; cursor: pointer;
    background: var(--blush); color: var(--button-fg);
  }
  .bell-btn:hover, .bell-btn[aria-expanded="true"] { background: var(--pink); }
  .bell-btn svg { width: 1.3rem; height: 1.3rem; }
  .bell-badge {
    position: absolute; top: -0.2rem; right: -0.25rem; box-sizing: border-box;
    min-width: 1.25rem; height: 1.25rem; padding: 0 0.3rem; border-radius: 999px;
    background: var(--button-fg); color: var(--surface);
    font-family: var(--body); font-weight: 700; font-size: 0.7rem; line-height: 1.25rem; text-align: center;
    font-variant-numeric: tabular-nums;
  }
  .notif-panel {
    position: absolute; top: calc(100% + 0.5rem); right: 0; z-index: 20;
    width: min(22rem, calc(100vw - 32px)); max-height: 70vh; overflow-y: auto;
    display: grid; gap: 0.2rem; padding: 0.6rem;
    background: var(--surface); border: 1px solid var(--line); border-radius: 1.25rem;
    box-shadow: 0 16px 40px rgba(142, 53, 83, 0.18);
  }
  .notif-head { padding: 0.35rem 0.6rem 0.5rem; font-family: var(--display); font-weight: 600; font-size: 1.05rem; color: var(--fg); }
  .notif-item {
    display: grid; gap: 0.1rem; width: 100%; text-align: left; cursor: pointer;
    background: transparent; border: 0; border-radius: 0.9rem; padding: 0.6rem 0.75rem;
    font-family: var(--body); color: var(--fg);
  }
  .notif-item:hover { background: var(--blush); }
  .notif-item.unread { background: var(--bg); }
  .notif-item.unread:hover { background: var(--blush); }
  .notif-who { font-weight: 700; font-size: 0.9rem; overflow-wrap: anywhere; }
  .notif-item.unread .notif-who::before {
    content: ""; display: inline-block; width: 0.5rem; height: 0.5rem; margin-right: 0.4rem;
    border-radius: 50%; background: var(--accent); vertical-align: middle;
  }
  .notif-what { font-size: 0.9rem; color: var(--muted); overflow-wrap: anywhere; }
  .notif-when { font-size: 0.75rem; color: var(--muted); }
  .notif-empty { padding: 0.25rem 0.6rem 0.6rem; font-size: 0.9rem; color: var(--muted); }

  /* Hero */
  .hero { padding-block: 3.5rem 4rem; }
  .hero .wrap { display: grid; grid-template-columns: 1.3fr 1fr; gap: 3rem; align-items: center; }
  .hero-text { display: grid; gap: 1.25rem; min-width: 0; }
  .eyebrow {
    display: inline-flex; align-items: center; gap: 0.5rem; justify-self: start;
    background: var(--blush); color: var(--accent);
    font-weight: 700; font-size: 0.8rem; letter-spacing: 0.12em; text-transform: uppercase;
    padding: 0.4rem 0.9rem; border-radius: 999px;
  }
  .eyebrow::before { content: ""; width: 0.5rem; height: 0.5rem; border-radius: 50%; background: var(--accent); }
  .hero h1 { font-size: clamp(2.6rem, 6.5vw, 4.5rem); font-weight: 700; overflow-wrap: anywhere; }
  .hero h1 .dollar { color: var(--accent); }
  .lede { font-size: 1.2rem; color: var(--muted); max-width: 34rem; white-space: pre-line; overflow-wrap: anywhere; }
  .cta-row { display: flex; gap: 0.75rem; flex-wrap: wrap; margin-top: 0.5rem; }
  .btn {
    display: inline-flex; align-items: center; justify-content: center;
    font-family: var(--display); font-weight: 600; font-size: 1rem;
    padding: 0.8rem 1.4rem; border-radius: 999px; text-decoration: none;
    border: 2px solid var(--accent); cursor: pointer; transition: transform 0.15s ease;
  }
  .btn-solid { background: var(--button); border-color: var(--button); color: var(--button-fg); }
  .btn-ghost { background: transparent; color: var(--accent); }
  .btn:hover { transform: translateY(-2px); }
  .btn:disabled { opacity: 0.6; cursor: wait; transform: none; }
  .back-btn {
    justify-self: start; font-family: var(--body); font-weight: 700; font-size: 0.9rem;
    color: var(--accent); background: none; border: 0; padding: 0; cursor: pointer;
  }
  .back-btn:hover { text-decoration: underline; text-underline-offset: 3px; }

  /* Editors: the owner edits the homepage and their profiles; invited people edit their own profile */
  .edit-btn {
    justify-self: start;
    font-family: var(--body); font-weight: 700; font-size: 0.85rem;
    color: var(--button-fg); background: var(--blush);
    border: 1px dashed var(--accent); border-radius: 999px;
    padding: 0.35rem 0.9rem; cursor: pointer;
  }
  .edit-btn:hover { background: var(--pink); }
  .edit-btn.armed { background: var(--button-fg); border-color: var(--button-fg); color: var(--surface); }
  .edit-form {
    display: grid; gap: 0.6rem; max-width: 34rem;
    background: var(--surface); border: 1px solid var(--line); border-radius: 1.25rem; padding: 1rem;
  }
  .edit-label { font-weight: 700; font-size: 0.8rem; letter-spacing: 0.08em; text-transform: uppercase; color: var(--accent); }
  .edit-form input, .edit-form textarea, .project-form input, .project-form textarea {
    font-family: var(--body); font-size: 1.05rem; line-height: 1.5; color: var(--fg);
    background: var(--bg); border: 1px solid var(--pink); border-radius: 0.9rem;
    padding: 0.7rem 0.9rem; width: 100%; box-sizing: border-box;
  }
  .edit-form textarea, .project-form textarea { resize: vertical; min-height: 5.5rem; }
  .edit-form .edit-label + *, .project-form .edit-label + * { margin-bottom: 0.4rem; }
  .edit-actions { display: flex; gap: 0.5rem; flex-wrap: wrap; align-items: center; }
  .edit-actions .btn { padding: 0.55rem 1.1rem; font-size: 0.95rem; }
  .edit-status { font-size: 0.85rem; color: var(--muted); min-height: 1.3em; }
  .btn.armed { background: var(--button-fg); border-color: var(--button-fg); color: var(--surface); }

  /* Hero art: three rails converging, drawn in CSS */
  .art {
    position: relative; aspect-ratio: 1; max-width: 100%;
    background: var(--blush); border-radius: 2.5rem; overflow: hidden;
  }
  .art .rails {
    position: absolute; inset: 18% 12% 0;
    display: grid; grid-template-columns: repeat(3, 1fr); gap: 10%;
    transform: perspective(380px) rotateX(48deg); transform-origin: bottom;
  }
  .art .rail {
    border-left: 4px solid var(--pink); border-right: 4px solid var(--pink);
    background: repeating-linear-gradient(to bottom, transparent 0 18px, var(--pink) 18px 26px);
    opacity: 0.9;
  }
  .art .coin {
    position: absolute; width: 16%; aspect-ratio: 1; border-radius: 50%;
    background: var(--surface); border: 4px solid var(--accent);
    display: grid; place-items: center;
    font-family: var(--display); font-weight: 700; color: var(--accent); font-size: clamp(1rem, 3vw, 1.6rem);
  }
  .art .c1 { top: 16%; left: 22%; }
  .art .c2 { top: 30%; left: 56%; width: 12%; }
  .art .c3 { top: 8%; left: 66%; width: 9%; font-size: clamp(0.7rem, 2vw, 1rem); }
  @media (prefers-reduced-motion: no-preference) {
    .art .coin { animation: bob 3.2s ease-in-out infinite; }
    .art .c2 { animation-delay: -1s; }
    .art .c3 { animation-delay: -2s; }
  }
  @keyframes bob { 50% { transform: translateY(-8px); } }

  /* Bands (Profiles on the homepage, Research on a profile) */
  .band { padding-block: 4rem; background: var(--surface); border-block: 1px solid var(--line); }
  .section-head { display: grid; gap: 0.6rem; max-width: 40rem; }
  .section-head h2 { font-size: clamp(1.9rem, 4vw, 2.6rem); font-weight: 600; }
  .card-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 17rem), 1fr)); gap: 1.25rem; margin-top: 2rem; }
  .empty-note { color: var(--muted); margin-top: 1rem; }

  /* Profile cards on the homepage */
  .profile-card {
    display: flex; flex-direction: column; gap: 0.9rem;
    background: var(--bg); border: 1px solid var(--line); border-radius: 1.5rem;
    padding: 1.5rem; min-width: 0;
  }
  .profile-top { display: flex; align-items: center; gap: 0.9rem; min-width: 0; }
  .avatar {
    flex: none; width: 3.25rem; aspect-ratio: 1; border-radius: 50%;
    background: var(--surface); border: 3px solid var(--accent);
    display: grid; place-items: center;
    font-family: var(--display); font-weight: 700; font-size: 1.4rem; color: var(--accent);
  }
  .avatar { overflow: hidden; }
  .profile-name { font-size: 1.35rem; font-weight: 600; overflow-wrap: anywhere; }
  .profile-name .dollar { color: var(--accent); }
  .profile-meta { display: flex; flex-wrap: wrap; align-items: center; gap: 0.4rem 0.75rem; font-size: 0.85rem; font-weight: 700; color: var(--muted); }
  #profile-filter { justify-self: start; }

  /* Likes and followers */
  .react-row { display: flex; flex-wrap: wrap; align-items: center; gap: 0.5rem; }
  .react-btn {
    display: inline-flex; align-items: center; gap: 0.45rem;
    font-family: var(--body); font-weight: 700; font-size: 0.9rem; color: var(--button-fg);
    background: var(--surface); border: 1.5px solid var(--pink); border-radius: 999px;
    padding: 0.4rem 1rem; cursor: pointer;
  }
  .react-btn:hover:not(:disabled) { background: var(--blush); }
  .react-btn[aria-pressed="true"] { background: var(--button); border-color: var(--button); }
  .react-btn:disabled { cursor: default; }
  .react-icon { color: var(--accent); }
  .react-btn[aria-pressed="true"] .react-icon { color: var(--button-fg); }
  .react-count { color: var(--muted); font-variant-numeric: tabular-nums; }
  .react-btn[aria-pressed="true"] .react-count { color: var(--button-fg); }
  .react-note { flex-basis: 100%; font-size: 0.85rem; color: var(--muted); }
  .you-badge { background: var(--blush); color: var(--button-fg); border-radius: 999px; padding: 0.05rem 0.55rem; }
  .profile-desc { color: var(--muted); white-space: pre-line; overflow-wrap: anywhere; }
  .profile-open { align-self: flex-start; margin-top: auto; padding: 0.6rem 1.15rem; font-size: 0.95rem; }

  /* Research project cards: title on top, About / Sources tabs below */
  .project {
    display: flex; flex-direction: column; gap: 0.75rem;
    background: var(--bg); border: 1px solid var(--line); border-radius: 1.5rem;
    padding: 1.5rem; min-width: 0;
  }
  .card-tabs {
    align-self: flex-start; display: flex; gap: 0.25rem;
    background: var(--blush); border-radius: 999px; padding: 0.25rem;
  }
  .card-tab {
    font-family: var(--body); font-weight: 700; font-size: 0.85rem; color: var(--button-fg);
    background: transparent; border: 0; border-radius: 999px; padding: 0.35rem 0.9rem; cursor: pointer;
  }
  .card-tab[aria-selected="true"] { background: var(--surface); box-shadow: 0 1px 3px rgba(142, 53, 83, 0.18); }
  .tab-panel { display: flex; flex-direction: column; gap: 0.75rem; }
  .source-list { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 0.5rem; }
  .source-list a {
    display: flex; flex-direction: column; text-decoration: none; color: var(--fg);
    background: var(--surface); border: 1px solid var(--line); border-radius: 0.9rem;
    padding: 0.55rem 0.8rem; overflow-wrap: anywhere;
  }
  .source-list a:hover { border-color: var(--accent); }
  .source-name { font-weight: 700; }
  .source-host { font-size: 0.8rem; color: var(--muted); }
  .sources-empty { color: var(--muted); font-size: 0.95rem; }
  .source-rows { display: flex; flex-direction: column; gap: 0.5rem; }
  .source-row {
    display: flex; flex-direction: column; gap: 0.35rem;
    border: 1px dashed var(--pink); border-radius: 0.9rem; padding: 0.6rem;
  }
  .source-row .mini-btn, .add-source { align-self: flex-start; }
  .project-title { font-size: 1.35rem; font-weight: 600; overflow-wrap: anywhere; }
  .project-title a { color: var(--fg); text-decoration: none; }
  .project-title a:hover { color: var(--accent); text-decoration: underline; text-underline-offset: 3px; }
  .project-arrow { color: var(--accent); }
  .project-desc { color: var(--muted); white-space: pre-line; overflow-wrap: anywhere; }
  .project-site {
    align-self: flex-start; display: inline-flex; align-items: center; gap: 0.4rem; max-width: 100%;
    font-weight: 700; font-size: 0.9rem; color: var(--button-fg); text-decoration: none;
    background: var(--blush); border-radius: 999px; padding: 0.35rem 0.9rem; overflow-wrap: anywhere;
  }
  .project-site:hover { background: var(--pink); }
  .project-tools { display: flex; gap: 0.5rem; margin-top: auto; padding-top: 0.75rem; border-top: 1px dashed var(--line); }
  .mini-btn {
    font-family: var(--body); font-weight: 700; font-size: 0.8rem;
    color: var(--button-fg); background: var(--blush);
    border: 1px solid var(--pink); border-radius: 999px; padding: 0.3rem 0.85rem; cursor: pointer;
  }
  .mini-btn:hover { background: var(--pink); }
  .project-form { gap: 0.5rem; }
  .add-card {
    display: grid; place-items: center; min-height: 11rem;
    border: 2px dashed var(--pink); border-radius: 1.5rem; background: transparent;
    color: var(--accent); font-family: var(--display); font-weight: 600; font-size: 1.1rem; cursor: pointer;
  }
  .add-card:hover { background: var(--blush); }

  /* Profile picture: an uploaded photo or a built character, standing on the tracks */
  .portrait {
    position: absolute; left: 50%; bottom: 9%; transform: translateX(-50%);
    width: 58%; aspect-ratio: 1; border-radius: 50%; overflow: hidden;
    border: 6px solid var(--surface); background: var(--surface);
    box-shadow: 0 10px 24px rgba(142, 53, 83, 0.18);
  }
  .art.has-portrait .c2 { display: none; }
  .portrait img, .portrait svg, .avatar img, .avatar svg, .pic-preview img, .pic-preview svg {
    display: block; width: 100%; height: 100%; object-fit: cover;
  }
  .edit-row { display: flex; flex-wrap: wrap; gap: 0.5rem; }
  .edit-row:not(:has(> :not([hidden]))) { display: none; }
  .pic-top { display: flex; flex-wrap: wrap; align-items: center; gap: 1rem; }
  .pic-preview {
    flex: none; width: 6.5rem; aspect-ratio: 1; border-radius: 50%; overflow: hidden;
    border: 4px solid var(--blush); background: var(--bg);
    display: grid; place-items: center; text-align: center; font-size: 0.8rem; color: var(--muted);
  }
  .card-tab[aria-pressed="true"] { background: var(--surface); box-shadow: 0 1px 3px rgba(142, 53, 83, 0.18); }
  .option-group { display: grid; gap: 0.35rem; }
  .chips { display: flex; flex-wrap: wrap; gap: 0.4rem; }
  .chip {
    font-family: var(--body); font-weight: 700; font-size: 0.85rem; color: var(--button-fg);
    background: var(--surface); border: 1px solid var(--pink); border-radius: 999px;
    padding: 0.35rem 0.8rem; cursor: pointer;
  }
  .chip[aria-pressed="true"] { background: var(--button); border-color: var(--button-fg); }
  .swatch {
    width: 2rem; height: 2rem; padding: 0; border-radius: 50%; cursor: pointer;
    border: 2px solid var(--surface); box-shadow: 0 0 0 1px var(--pink);
  }
  .swatch[aria-pressed="true"] { box-shadow: 0 0 0 3px var(--accent); }
  .pic-note { font-size: 0.85rem; color: var(--muted); }
  .sr-only {
    position: absolute; width: 1px; height: 1px; overflow: hidden;
    clip: rect(0 0 0 0); clip-path: inset(50%); white-space: nowrap;
  }
  .sr-only:focus-visible + label { outline: 3px solid var(--accent); outline-offset: 3px; }

  /* Contact */
  .contact { padding-block: 4.5rem 5rem; }
  .contact-card {
    display: grid; grid-template-columns: 1.2fr 1fr; gap: 2rem; align-items: center;
    background: var(--blush); border-radius: 2rem; padding: clamp(1.75rem, 4vw, 3rem);
  }
  .contact-card h2 { font-size: clamp(1.9rem, 4vw, 2.6rem); font-weight: 600; margin-bottom: 0.6rem; }
  .contact-card p { color: var(--muted); }
  .email-box {
    display: flex; align-items: center; gap: 0.5rem; flex-wrap: wrap;
    background: var(--surface); border-radius: 1.25rem; padding: 0.75rem 0.75rem 0.75rem 1.25rem; min-width: 0;
  }
  .email-box .addr {
    flex: 1 1 12rem; min-width: 0; overflow-wrap: anywhere;
    font-weight: 700; font-size: 1.05rem; user-select: all;
  }
  .copy-btn { padding: 0.55rem 1.1rem; font-size: 0.95rem; }
  .copy-status { font-size: 0.85rem; color: var(--muted); min-height: 1.3em; margin-top: 0.5rem; }

  footer { padding-block: 1.75rem; border-top: 1px solid var(--line); color: var(--muted); font-size: 0.9rem; }

  @media (max-width: 820px) {
    .hero .wrap { grid-template-columns: 1fr; gap: 2rem; }
    .art { max-width: 16rem; width: 100%; }
    .contact-card { grid-template-columns: 1fr; }
  }
  /* Phones: tighter spacing, a smaller drawing, full-width buttons, and the menu kept visible */
  @media (max-width: 480px) {
    .top { padding-block: 0.9rem; }
    .top .wrap { gap: 0.25rem 1rem; }
    .nav { gap: 1rem; flex-wrap: wrap; }
    .nav a { font-size: 0.9rem; padding-block: 0.4rem; }
    .hero { padding-block: 1.25rem 2.5rem; }
    .hero .wrap { gap: 1.5rem; }
    .hero-text { gap: 1rem; }
    .hero h1 { font-size: clamp(2.1rem, 10vw, 2.6rem); }
    .lede { font-size: 1.1rem; }
    .art { max-width: 11rem; border-radius: 1.75rem; }
    .cta-row { margin-top: 0.25rem; }
    .cta-row .btn { flex: 1 1 auto; }
    .band { padding-block: 2.75rem; }
    .card-grid { margin-top: 1.25rem; gap: 1rem; }
    .profile-card, .project { padding: 1.15rem; border-radius: 1.25rem; }
    .profile-open { align-self: stretch; }
    .add-card { min-height: 7rem; }
    .contact { padding-block: 3rem 3.5rem; }
    .contact-card { gap: 1.25rem; border-radius: 1.5rem; }
    .email-box { padding: 0.75rem; }
    .copy-btn { flex: 1 1 auto; }
    .edit-form { padding: 0.85rem; }
    .edit-actions .btn { flex: 1 1 auto; }
  }
  /* Touch screens: larger tap targets and no hover lift */
  @media (pointer: coarse) {
    .mini-btn, .card-tab, .edit-btn, .chip, .react-btn { min-height: 2.75rem; }
    .swatch { width: 2.5rem; height: 2.5rem; }
    .mini-btn { padding-inline: 1rem; }
    .back-btn { min-height: 2.75rem; padding-block: 0.4rem; }
    .source-list a { padding-block: 0.75rem; }
    .btn:hover { transform: none; }
  }
</style>

<template id="page-markup">
<header class="top">
  <div class="wrap">
    <a class="brand" href="#top" id="brand-name"></a>
    <div class="top-actions">
      <nav class="nav" aria-label="Sections">
        <a href="#profiles" id="nav-profiles">Profiles</a>
        <a href="#top" id="nav-home" hidden>All profiles</a>
        <a href="#research" id="nav-research" hidden>Research</a>
        <a href="#contact" id="nav-contact" hidden>Contact</a>

    var SVG_NS = 'http://www.w3.org/2000/svg';
    function renderCharacter(c, label) {
      var svg = document.createElementNS(SVG_NS, 'svg');
      svg.setAttribute('viewBox', '0 0 120 120');
      svg.setAttribute('role', 'img');
      svg.setAttribute('aria-label', label);
      function add(tag, attrs) {
        var n = document.createElementNS(SVG_NS, tag);
        for (var k in attrs) n.setAttribute(k, attrs[k]);
        svg.appendChild(n);
      }
      var skin = CHAR.skin[c.skin], hair = CHAR.hairColor[c.hairColor], top = CHAR.top[c.top];
      var ink = '#3A2A30';
      var line = { fill: 'none', stroke: ink, 'stroke-width': 2.4, 'stroke-linecap': 'round' };
      function withLine(d) { var a = { d: d }; for (var k in line) a[k] = line[k]; return a; }

      add('rect', { width: 120, height: 120, fill: CHAR.bg[c.bg] });
      if (c.hairStyle === 2) add('path', { d: 'M34 54 C34 26 86 26 86 54 L89 92 L72 92 L72 64 L48 64 L48 92 L31 92 Z', fill: hair });
      // Shoulders, neck, ears, head
      add('path', { d: 'M18 120 C18 94 38 86 60 86 C82 86 102 94 102 120 Z', fill: top });
      add('rect', { x: 52, y: 72, width: 16, height: 16, rx: 6, fill: skin });
      add('path', { d: 'M50 87 Q60 96 70 87', fill: 'none', stroke: 'rgba(0,0,0,0.12)', 'stroke-width': 3, 'stroke-linecap': 'round' });
      add('circle', { cx: 36.5, cy: 59, r: 5, fill: skin });
      add('circle', { cx: 83.5, cy: 59, r: 5, fill: skin });
      add('circle', { cx: 60, cy: 56, r: 24, fill: skin });
      // Hair: a cap slightly wider than the head (radius 26 vs 24) so no skin shows above the hairline
      var hairCap = 'M34 57 A26 26 0 0 1 86 57 C80 45 69 40 60 41 C51 40 40 45 34 57 Z';
      if (c.hairStyle === 0 || c.hairStyle === 2 || c.hairStyle === 3 || c.hairStyle === 4) {
        add('path', { d: hairCap, fill: hair });
      }
      if (c.hairStyle === 1) {
        add('path', { d: 'M34 57 L34 40 L41 39 L44 26 L53 30 L60 20 L67 31 L76 25 L78 38 L86 42 L86 57 C80 45 70 40 60 41 C50 40 40 45 34 57 Z', fill: hair });
      }
      if (c.hairStyle === 3) add('circle', { cx: 60, cy: 27, r: 9, fill: hair });
      if (c.hairStyle === 4) {
        [[39, 47, 9], [45, 37, 10], [57, 32, 11], [70, 35, 10], [80, 45, 9]].forEach(function (b) {
          add('circle', { cx: b[0], cy: b[1], r: b[2], fill: hair });
        });
      }
      // Bangs across the forehead, stopping above the eyes
      if (c.bangs === 1) {
        add('path', { d: 'M37 52 C36 33 84 33 83 52 Q78 48.5 73 52 Q67 48.5 61 52 Q55 48.5 49 52 Q43 48.5 37 52 Z', fill: hair });
      }
      if (c.bangs === 2) {
        add('path', { d: 'M37 51 C36 33 84 31 84 49 C76 45 66 46 57 50 C50 53 43 54 37 51 Z', fill: hair });
      }
      if (c.bangs === 3) {
        add('path', { d: 'M37 50 C36 33 84 33 83 50 L79 46 L76 52 L71 46 L66 52 L61 46 L56 52 L51 46 L46 52 L42 46 Z', fill: hair });
      }
      // Face
      add('circle', { cx: 47, cy: 66, r: 4, fill: '#F29BB2', opacity: 0.45 });
      add('circle', { cx: 73, cy: 66, r: 4, fill: '#F29BB2', opacity: 0.45 });
      if (c.glasses !== 2) {
        add('circle', { cx: 51, cy: 58, r: 2.6, fill: ink });
        add('circle', { cx: 69, cy: 58, r: 2.6, fill: ink });
      }
      if (c.face === 0) add('path', withLine('M52 67 Q60 74 68 67'));
      if (c.face === 1) add('path', { d: 'M51 66 Q60 77 69 66 Z', fill: '#FFFFFF', stroke: ink, 'stroke-width': 2, 'stroke-linejoin': 'round' });
      if (c.face === 2) add('path', withLine('M53 69 Q61 71 68 66'));
      if (c.glasses === 1) {
        add('circle', { cx: 51, cy: 58, r: 6.5, fill: 'none', stroke: ink, 'stroke-width': 2 });
        add('circle', { cx: 69, cy: 58, r: 6.5, fill: 'none', stroke: ink, 'stroke-width': 2 });
        add('path', { d: 'M57.5 58 L62.5 58', stroke: ink, 'stroke-width': 2 });
      }
      if (c.glasses === 2) {
        add('rect', { x: 43, y: 53, width: 15, height: 10, rx: 4, fill: ink });
        add('rect', { x: 62, y: 53, width: 15, height: 10, rx: 4, fill: ink });
        add('path', { d: 'M58 57 L62 57', stroke: ink, 'stroke-width': 2 });
      }
      // Headwear, in the outfit color
      if (c.headwear === 1) {
        add('path', { d: 'M35 52 C35 28 85 28 85 52 Z', fill: top });
        add('path', { d: 'M80 49 L101 52 Q102 56 98 57 L80 54 Z', fill: top });
        add('rect', { x: 35, y: 49, width: 50, height: 5, rx: 2.5, fill: 'rgba(0,0,0,0.14)' });
      }
      if (c.headwear === 2) {
        add('path', { d: 'M34 52 C34 24 86 24 86 52 Z', fill: top });
        add('rect', { x: 33, y: 46, width: 54, height: 9, rx: 4.5, fill: top });
        add('rect', { x: 33, y: 46, width: 54, height: 9, rx: 4.5, fill: 'rgba(255,255,255,0.3)' });
        add('circle', { cx: 60, cy: 24, r: 5.5, fill: '#FFFFFF' });
      }
      if (c.headwear === 3) {
        add('path', { d: 'M33 60 C33 22 87 22 87 60', fill: 'none', stroke: ink, 'stroke-width': 5, 'stroke-linecap': 'round' });
        add('rect', { x: 27, y: 51, width: 11, height: 18, rx: 5, fill: top });
        add('rect', { x: 82, y: 51, width: 11, height: 18, rx: 5, fill: top });

    function pictureNode(avatar, name) {
      if (!avatar) return null;
      if (avatar.mode === 'photo') {
        var img = make('img');

        return img;

    // Crops a chosen image to a centered square and shrinks it to a small JPEG.
    function loadPhoto(file, onDone, onError) {
      if (!file || !/^image\//.test(file.type)) { onError('Choose an image file, such as a JPG or PNG.'); return; }
      var url = URL.createObjectURL(file);
      var img = new Image();
      img.onload = function () {
        var size = 320;
        var canvas = document.createElement('canvas');
        canvas.width = size;
        canvas.height = size;
        var side = Math.min(img.naturalWidth, img.naturalHeight);
        var ctx = canvas.getContext('2d');
        ctx.fillStyle = '#FFFFFF';
        ctx.fillRect(0, 0, size, size);
        ctx.drawImage(img, (img.naturalWidth - side) / 2, (img.naturalHeight - side) / 2, side, side, 0, 0, size, size);
        URL.revokeObjectURL(url);
        try { onDone(canvas.toDataURL('image/jpeg', 0.85)); } catch (e) { onError('That image could not be used. Try a different photo.'); }
      };
      img.onerror = function () {
        URL.revokeObjectURL(url);
        onError('That image could not be opened. Try a JPG or PNG photo.');
      };
      img.src = url;
    }

    form.addEventListener('submit', function (e) {

    // ---- Profile: research project cards ----
    var projectsEl = document.getElementById('projects');

        editingId = null;

      });

    function projectCard(p, editable) {
      var card = make('article', 'project');
      var title = make('h3', 'project-title');
      var href = cleanLink(p.link);
      if (href) {
        var a = make('a', null, p.title);
        a.href = href;
        a.target = '_blank';
        a.rel = 'noopener noreferrer';
        var arrow = make('span', 'project-arrow', ' ↗');
        arrow.setAttribute('aria-hidden', 'true');
        a.appendChild(arrow);
        title.appendChild(a);
      } else {
        title.textContent = p.title;
      }
      card.appendChild(title);

      var about = make('div', 'tab-panel');
      about.appendChild(make('p', 'project-desc', p.description));
      if (href) {
        // The linked website's home address, shown under the description.
        var site = make('a', 'project-site', hostOf(href));
        site.href = href;
        site.target = '_blank';
        site.rel = 'noopener noreferrer';
        var siteArrow = make('span', 'project-arrow', '↗');
        siteArrow.setAttribute('aria-hidden', 'true');
        site.appendChild(siteArrow);
        about.appendChild(site);
      }

      // Visitors only get the tabs when there are sources to show; whoever can edit always does.
      if (p.sources.length || editable) {
        var sources = make('div', 'tab-panel');
        if (p.sources.length) {
          var list = make('ul', 'source-list');
          p.sources.forEach(function (s) {
            var sHref = cleanLink(s.link);
            if (!sHref) return;
            var li = make('li');
            var sa = make('a');
            sa.href = sHref;
            sa.target = '_blank';
            sa.rel = 'noopener noreferrer';
            sa.appendChild(make('span', 'source-name', (s.name || hostOf(sHref)) + ' ↗'));
            sa.appendChild(make('span', 'source-host', hostOf(sHref)));
            li.appendChild(sa);
            list.appendChild(li);
          });
          sources.appendChild(list);
        } else {
          sources.appendChild(make('p', 'sources-empty', 'No sources yet. Click Edit to add links to your sources.'));
        }

        var tabs = make('div', 'card-tabs');
        tabs.setAttribute('role', 'tablist');
        tabs.setAttribute('aria-label', p.title + ' sections');
        var panels = [about, sources];
        var labels = ['About', 'Sources (' + p.sources.length + ')'];
        var tabButtons = panels.map(function (panel, i) {
          var tab = make('button', 'card-tab', labels[i]);
          tab.type = 'button';
          tab.id = 'tab-' + p.id + '-' + i;
          panel.id = 'panel-' + p.id + '-' + i;
          tab.setAttribute('role', 'tab');
          tab.setAttribute('aria-controls', panel.id);
          panel.setAttribute('role', 'tabpanel');
          panel.setAttribute('aria-labelledby', tab.id);
          tabs.appendChild(tab);
          return tab;
        });
        var select = function (index) {
          tabButtons.forEach(function (tab, i) {
            tab.setAttribute('aria-selected', i === index ? 'true' : 'false');
            tab.tabIndex = i === index ? 0 : -1;
            panels[i].hidden = i !== index;
          });
          openTabs[p.id] = index;
        };
        tabButtons.forEach(function (tab, i) {
          tab.addEventListener('click', function () { select(i); });
          tab.addEventListener('keydown', function (e) {
            if (e.key === 'ArrowRight' || e.key === 'ArrowLeft') {
              var nextIndex = (i + 1) % tabButtons.length;
              select(nextIndex);
              tabButtons[nextIndex].focus();
            }
          });
        });
        card.appendChild(tabs);
        card.appendChild(about);
        card.appendChild(sources);
        select(openTabs[p.id] || 0);
      } else {
        card.appendChild(about);
      }

      if (editable) {
        var tools = make('div', 'project-tools');
        var edit = make('button', 'mini-btn', 'Edit');
        edit.type = 'button';
        edit.addEventListener('click', function () { openProject(p.id); });
        tools.appendChild(edit);
        card.appendChild(tools);
      }
      return card;
    }

    function projectForm(p) {
      var isNew = !p;
      var f = make('form', 'project project-form');
      var titleIn = textInput(80, isNew ? '' : p.title);
      var linkIn = textInput(500, isNew ? '' : p.link);

      linkIn.placeholder = 'https://…';
      var descIn = textArea(400, isNew ? '' : p.description);

      field('Title', titleIn, 'project-title-input')
        .concat(field('Link to your research (optional)', linkIn, 'project-link-input'))

      // Sources: any number of name + link rows.
      var sourcesLabel = make('span', 'edit-label', 'Sources');

      var rowsEl = make('div', 'source-rows');
      rowsEl.setAttribute('role', 'group');
      rowsEl.setAttribute('aria-labelledby', 'project-sources-label');
      var rowCount = 0;
      function addSourceRow(s) {
        var n = rowCount++;
        var row = make('div', 'source-row');
        var nameIn = textInput(120, s ? s.name : '');
        nameIn.id = 'source-name-' + n;
        nameIn.placeholder = 'Source name (optional)';
        nameIn.setAttribute('aria-label', 'Source name');
        nameIn.className = 'source-name-input';
        var sLinkIn = textInput(500, s ? s.link : '');
        sLinkIn.id = 'source-link-' + n;
        sLinkIn.inputMode = 'url';
        sLinkIn.placeholder = 'https://…';
        sLinkIn.setAttribute('aria-label', 'Source link');
        sLinkIn.className = 'source-link-input';
        var remove = make('button', 'mini-btn', 'Remove');
        remove.type = 'button';
        remove.addEventListener('click', function () { row.remove(); });
        row.appendChild(nameIn);
        row.appendChild(sLinkIn);
        row.appendChild(remove);
        rowsEl.appendChild(row);
        return sLinkIn;
      }
      (isNew ? [] : p.sources).forEach(addSourceRow);
      var addSource = make('button', 'mini-btn add-source', '+ Add a source');
      addSource.type = 'button';
      addSource.addEventListener('click', function () { addSourceRow(null).focus(); });
      f.appendChild(sourcesLabel);
      f.appendChild(rowsEl);
      f.appendChild(addSource);

      var actions = make('div', 'edit-actions');
      var save = make('button', 'btn btn-solid', isNew ? 'Add project' : 'Save');
      save.type = 'submit';
      var cancel = make('button', 'btn btn-ghost', 'Cancel');
      cancel.type = 'button';
      actions.appendChild(save);
      actions.appendChild(cancel);
      var buttons = [save, cancel];
      var del = null;
      if (!isNew) {
        del = make('button', 'btn btn-ghost', 'Delete');
        del.type = 'button';
        actions.appendChild(del);
        buttons.push(del);
      }
      f.appendChild(actions);
      var statusEl = statusLine('Only you can see this form.');
      f.appendChild(statusEl);

      cancel.addEventListener('click', function () {
        editingId = null;
        renderProfile();
      });

      if (del) {
        var armed = false;
        del.addEventListener('click', function () {
          if (!armed) {
            armed = true;
            del.textContent = 'Click again to delete';
            del.classList.add('armed');
            statusEl.textContent = 'This removes the project from the site.';
            return;
          }
          saveProjects(current().projects.filter(function (q) { return q.id !== p.id; }), statusEl, buttons);
        });
      }

      f.addEventListener('submit', function (e) {
        e.preventDefault();
        var t = titleIn.value.trim();
        var d = descIn.value.trim();
        var link = cleanLink(linkIn.value);
        if (!t) {
          statusEl.textContent = 'Write a title before saving.';
          titleIn.focus();
          return;
        }
        if (link === null) {
          statusEl.textContent = 'That link does not look right. Paste the full web address, like https://example.com/my-paper.';
          linkIn.focus();
          return;
        }
        if (!d) {
          statusEl.textContent = 'Write a description before saving.';
          descIn.focus();
          return;
        }
        var sourceList = [];
        var rows = rowsEl.querySelectorAll('.source-row');
        for (var i = 0; i < rows.length; i++) {
          var sName = rows[i].querySelector('.source-name-input').value.trim();
          var sLinkInput = rows[i].querySelector('.source-link-input');
          var sRaw = sLinkInput.value.trim();
          if (!sName && !sRaw) continue;
          var sLink = cleanLink(sRaw);
          if (!sLink) {
            statusEl.textContent = sRaw
              ? 'One of the source links does not look right. Paste the full web address, like https://example.com/article.'
              : 'Add a link for each source, or remove the ones you do not need.';
            sLinkInput.focus();
            return;
          }
          sourceList.push({ name: sName, link: sLink });
        }
        var entry = {
          id: isNew ? newId() : p.id, title: t, link: link, description: d, sources: sourceList,
          createdAt: isNew ? Date.now() : p.createdAt
        };
        var list = current().projects;
        saveProjects(isNew
          ? list.concat([entry])
          : list.map(function (q) { return q.id === p.id ? entry : q; }),
          statusEl, buttons);
      });
      return f;
    }

    function addProjectCard() {
      var b = make('button', 'add-card', '+ Add a research project');
      b.type = 'button';
      b.addEventListener('click', function () { openProject('new'); });
      return b;
    }

    function renderProjects() {
      var p = current();

      projectsEl.textContent = '';
      p.projects.forEach(function (q) {
        projectsEl.appendChild(editingId === q.id ? projectForm(q) : projectCard(q, editable));
      });
      if (editable) projectsEl.appendChild(editingId === 'new' ? projectForm(null) : addProjectCard());
      projectsEl.hidden = !p.projects.length && !editable;
      emptyEl.hidden = p.projects.length > 0 || editable;

    // A refused page save means this view can't publish: drop the owner's editing controls.
    function lockOwnerEditing() {
      isOwner = false;
      editingId = null;
      addingProfile = null;
      closeHubForm();
      closePicEditor();
      rerender();
    }

    function rerender() {
      if (currentId && current()) renderProfile(); else renderHome();
    }
    function busy() {
      return editingId !== null || !form.hidden || !picForm.hidden || addingProfile !== null || !hubForm.hidden;
    }

    // ---- Likes and followers ----
    var reactRow = document.getElementById('react-row');
    var likeBtn = document.getElementById('like-btn');
    var followBtn = document.getElementById('follow-btn');
    var reactNote = document.getElementById('react-note');
    var filterEl = document.getElementById('profile-filter');
    var filterAll = document.getElementById('filter-all');
    var filterFollowing = document.getElementById('filter-following');
    var homeFilter = 'all';
    var writingReaction = false;

    function setReactButton(b, on, icon, label, count) {
      b.setAttribute('aria-pressed', on ? 'true' : 'false');
      b.querySelector('.react-icon').textContent = icon;
      b.querySelector('.react-label').textContent = label;
      b.querySelector('.react-count').textContent = count;
    }
    function renderProfileReactions() {
      var p = currentId && current();
      if (!p || !db || !reactionsLoaded) { reactRow.hidden = true; return; }
      var mine = myReactions();
      var liked = !!mine.likes[p.id];
      var following = !!mine.follows[p.id];
      // Anyone who can save may like and follow any profile, including ones they manage.
      var able = !!myId && canReact !== false;
      setReactButton(likeBtn, liked, '♥', liked ? 'Liked' : 'Like', String(countFor(p.id, 'likes')));
      setReactButton(followBtn, following, following ? '✓' : '+', following ? 'Following' : 'Follow',
        plural(countFor(p.id, 'follows'), 'follower'));
      likeBtn.disabled = !able || writingReaction;
      followBtn.disabled = !able || writingReaction;
      reactNote.textContent = able ? '' : 'Only people invited to this site can like and follow profiles.';
      reactNote.hidden = !reactNote.textContent;
      reactRow.hidden = false;
    }
    function toggleReaction(kind) {
      var p = current();
      if (!p || !myId || writingReaction) return;
      var before = myReactions();
      var next = { likes: Object.assign({}, before.likes), follows: Object.assign({}, before.follows) };
      if (next[kind][p.id]) delete next[kind][p.id];
      else next[kind][p.id] = kind === 'follows' ? Date.now() : true;
      var hadDoc = !!reactions[myId];
      reactions[myId] = next;
      writingReaction = true;
      renderProfileReactions();
      db.doc('reactions/' + myId).set({ likes: next.likes, follows: next.follows }).then(function () {
        writingReaction = false;
        renderProfileReactions();
      }, function (err) {
        writingReaction = false;
        if (hadDoc) reactions[myId] = before; else delete reactions[myId];
        if (err && err.code === 'invalid_argument') canReact = false;
        renderProfileReactions();
        if (canReact !== false) {
          reactNote.textContent = dbMessage(err);
          reactNote.hidden = false;
        }
      });
    }
    likeBtn.addEventListener('click', function () { toggleReaction('likes'); });
    followBtn.addEventListener('click', function () { toggleReaction('follows'); });
    function onReactionsChanged() {
      renderProfileReactions();
      renderBell();
      if (!currentId && !busy()) renderHome();
    }

    // ---- Notification bell ----
    // Lists research added to profiles this viewer follows, newest first. "Seen up to" is kept
    // in the viewer's private data/users/<id>/notifs document, which nobody else can read.
    var bellBtn = document.getElementById('bell-btn');
    var bellBadge = document.getElementById('bell-badge');
    var notifPanel = document.getElementById('notif-panel');
    var seenAt = 0;
    var seenLoaded = false;

    function collectNotifs() {
      var follows = myReactions().follows;
      var items = [];
      allProfiles().forEach(function (p) {
        var since = follows[p.id];
        if (!since) return;
        var after = typeof since === 'number' ? since : 0;
        p.projects.forEach(function (q) {
          if (q.createdAt && q.createdAt > after) items.push({ profile: p, project: q });
        });
      });
      items.sort(function (a, b) { return b.project.createdAt - a.project.createdAt; });
      return items.slice(0, 30);
    }
    function timeAgo(t) {
      var mins = Math.max(0, Math.round((Date.now() - t) / 60000));
      if (mins < 1) return 'Just now';
      if (mins < 60) return plural(mins, 'minute') + ' ago';
      var hours = Math.round(mins / 60);
      if (hours < 24) return plural(hours, 'hour') + ' ago';
      return plural(Math.round(hours / 24), 'day') + ' ago';
    }
    function renderBell() {
      var show = !!db && !!myId && reactionsLoaded && seenLoaded && canReact !== false;
      bellBtn.hidden = !show;
      if (!show) { closeNotifs(); return; }
      var unread = collectNotifs().filter(function (n) { return n.project.createdAt > seenAt; }).length;
      bellBadge.textContent = unread > 9 ? '9+' : String(unread);
      bellBadge.hidden = !unread;
      bellBtn.setAttribute('aria-label', unread ? 'Notifications, ' + unread + ' new' : 'Notifications');
    }
    function fillNotifPanel(lastSeen) {
      notifPanel.textContent = '';
      notifPanel.appendChild(make('p', 'notif-head', 'Notifications'));
      var items = collectNotifs();
      if (!items.length) {
        notifPanel.appendChild(make('p', 'notif-empty', Object.keys(myReactions().follows).length
          ? 'Nothing new yet. When a profile you follow adds research, it shows up here.'
          : 'Follow a profile to hear when it adds new research.'));
        return;
      }
      items.forEach(function (n) {
        var b = make('button', 'notif-item' + (n.project.createdAt > lastSeen ? ' unread' : ''));
        b.type = 'button';
        b.appendChild(make('span', 'notif-who', n.profile.name));
        b.appendChild(make('span', 'notif-what', 'Added new research: ' + n.project.title));
        b.appendChild(make('span', 'notif-when', timeAgo(n.project.createdAt)));
        b.addEventListener('click', function () {
          closeNotifs();
          showProfile(n.profile.id);
          var research = document.getElementById('research');
          if (research) research.scrollIntoView();
        });
        notifPanel.appendChild(b);
      });
    }
    function openNotifs() {
      fillNotifPanel(seenAt);
      notifPanel.hidden = false;
      bellBtn.setAttribute('aria-expanded', 'true');
      // Opening the bell marks everything in it as seen.
      var newest = collectNotifs().reduce(function (m, n) { return Math.max(m, n.project.createdAt); }, 0);
      if (newest > seenAt) {
        seenAt = newest;
        renderBell();
        db.doc('data/users/' + myId + '/notifs').set({ seenAt: seenAt }).catch(function () {});
      }
    }
    function closeNotifs() {
      if (notifPanel.hidden) return;
      notifPanel.hidden = true;
      bellBtn.setAttribute('aria-expanded', 'false');
    }
    bellBtn.addEventListener('click', function () {
      if (notifPanel.hidden) openNotifs(); else closeNotifs();
    });
    document.addEventListener('click', function (e) {
      if (!notifPanel.hidden && !e.target.closest('.top-actions')) closeNotifs();
    });
    document.addEventListener('keydown', function (e) {
      if (e.key === 'Escape' && !notifPanel.hidden) { closeNotifs(); bellBtn.focus(); }
    });
    filterAll.addEventListener('click', function () { homeFilter = 'all'; renderHome(); });
    filterFollowing.addEventListener('click', function () { homeFilter = 'following'; renderHome(); });

    // ---- Start: reopen the view from before a save, or a profile named in the link ----
    var start = null;
    try {
      start = sessionStorage.getItem(VIEW_KEY);
      sessionStorage.removeItem(VIEW_KEY);
    } catch (e) {}
    if (!start || start === 'home') start = start === 'home' ? null : location.hash.slice(1);
    var pendingStart = null; // an invited person's profile, shown once the database answers
    if (start && findProfile(start)) {
      showProfile(start);
    } else {
      if (start && start.indexOf(MEMBER_PREFIX) === 0) pendingStart = start;
      showHome();
    }

    function onMembersChanged() {
      renderBell();
      if (pendingStart && !currentId && findProfile(pendingStart)) {
        var id = pendingStart;
        pendingStart = null;
        showProfile(id);
        return;
      }
      pendingStart = null;
      if (busy()) return;
      if (currentId && !current()) { showHome(); return; }
      rerender();
    }

    if (window.claude && typeof window.claude.use === 'function') {
      Promise.all([
        window.claude.use('artifact'),
        window.claude.use('user'),
        window.claude.use('db')
      ]).then(function (found) {
        artifact = found[0];
        var user = found[1];
        db = found[2];
        if (!user) return;
        return Promise.all([user.isOwner(), user.id()]).then(function (who) {
          isOwner = !!who[0] && !!artifact;
          myId = who[1];
          if (db) {
            db.collection('profiles').orderBy('createdAt').onSnapshot(function (snap) {
              members = snap.docs.filter(function (d) { return d.exists; }).map(function (d) {
                return memberFrom(d.id, d.data() || {});
              });
              membersLoaded = true;
              onMembersChanged();
            }, function () {
              // The listener ended (access changed or the connection dropped); keep what is shown.
            });
            db.collection('reactions').onSnapshot(function (snap) {
              var next = {};
              snap.docs.forEach(function (d) {
                if (!d.exists) return;
                var data = d.data() || {};
                next[d.id] = { likes: idSet(data.likes), follows: idSet(data.follows) };
              });
              reactions = next;
              reactionsLoaded = true;
              onReactionsChanged();
            }, function () {});
            if (myId) {
              db.doc('data/users/' + myId + '/notifs').get().then(function (snap) {
                var saved = snap.exists ? snap.data() : null;
                seenAt = saved && typeof saved.seenAt === 'number' ? saved.seenAt : 0;
                seenLoaded = true;
                renderBell();
              }, function () {
                seenLoaded = true;
                renderBell();
              });
            }
          }
          if (typeof user.can === 'function') {
            user.can('data.write').then(function (allowed) {
              if (allowed === false) canReact = false;
              renderProfileReactions();
              renderBell();
            });
          }
          if (!busy()) rerender();
        });
      }).catch(function () {});
    }

    // ---- Copy email ----
    var btn = document.getElementById('copy-email');
    var copyStatus = document.getElementById('copy-status');
    function selectText() {
      var range = document.createRange();
      range.selectNodeContents(addr);
      var sel = window.getSelection();
      sel.removeAllRanges();
      sel.addRange(range);
    }
    btn.addEventListener('click', function () {
      var text = addr.textContent.trim();
      try {
        navigator.clipboard.writeText(text).then(function () {
          copyStatus.textContent = 'Copied to your clipboard.';
        }, function () {
          selectText();
          copyStatus.textContent = 'Selected. Press Ctrl+C (or Cmd+C) to copy.';
        });
      } catch (e) {
        selectText();
        copyStatus.textContent = 'Selected. Press Ctrl+C (or Cmd+C) to copy.';
      }
    });
  })();
</script>
